[project]
name = "credit-default-gbm"
version = "0.1.0"
description = "Credit-card default model: XGBoost with validation gates, calibration, reason codes, a scoring API and drift monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.1",
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "scikit-learn>=1.9.1",
    "tabulate>=0.10.0",
    "uvicorn>=0.54.0",
    "xgboost>=3.2.0",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
