name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.1"
      - run: uv sync --frozen
      - run: uv run pytest -q

  container:
    # Builds the image (which trains on the real data and must pass the release gate),
    # then starts it and checks the API answers.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t credit-default-gbm .
      - run: docker run -d --name api -p 8000:8000 credit-default-gbm
      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            curl -fsS localhost:8000/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1
      - name: Score sample applicants
        run: |
          curl -fsS -X POST localhost:8000/score \
            -H 'content-type: application/json' \
            -d @examples/applicants.json | tee scores.json
          python3 - <<'EOF'
          import json
          s = json.load(open("scores.json"))["scores"]
          risky, safe = s[0]["probability_of_default"], s[1]["probability_of_default"]
          assert len(s) == 2 and risky > safe, (risky, safe)
          print(f"ok: {risky:.3f} > {safe:.3f}")
          EOF

  deploy:
    # Ships to the Hugging Face Space only after tests and the container check pass.
    # Runs once the repo has an HF_SPACE variable ("user/space") and an HF_TOKEN secret.
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan space
          # Spaces read their settings from front matter at the top of README.md.
          printf -- '---\ntitle: Credit Default Scoring\nemoji: 💳\ncolorFrom: blue\ncolorTo: green\nsdk: docker\napp_port: 8000\npinned: false\n---\n\n' > space_readme.md
          cat README.md >> space_readme.md && mv space_readme.md README.md
          git add -A && git commit -qm "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force "https://hf:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" space:main
